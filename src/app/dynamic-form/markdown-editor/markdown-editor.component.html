<div class="markdown-editor" [class.disabled]="disabled">
  <div class="markdown-toolbar">
    @for (item of toolbarActions; track item.tooltip) {
      <button
        type="button"
        mat-icon-button
        [matTooltip]="item.tooltip"
        [disabled]="disabled"
        (click)="item.action()">
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        } @else {
          <span class="toolbar-text-icon">{{ item.label }}</span>
        }
      </button>
    }

    <button
      type="button"
      mat-icon-button
      #illustrationMenuTrigger="matMenuTrigger"
      [matMenuTriggerFor]="illustrationMenu"
      matTooltip="Insert illustration"
      [disabled]="disabled">
      <mat-icon>image</mat-icon>
    </button>
    <mat-menu #illustrationMenu="matMenu">
      <div (click)="$event.stopPropagation()">
        <div class="illustration-size-row">
          <span class="illustration-size-label">Insert size</span>
          @for (size of illustrationSizes; track size.value) {
            <button
              type="button"
              class="illustration-size-option"
              [class.selected]="size.value === insertSize"
              (click)="insertSize = size.value">
              {{ size.label }}
            </button>
          }
        </div>
        <app-illustration-menu (pick)="insertIllustration($event); illustrationMenuTrigger.closeMenu()">
        </app-illustration-menu>
      </div>
    </mat-menu>
  </div>

  <div class="markdown-panes">
    <textarea
      #textareaEl
      class="markdown-textarea"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
      placeholder="Write markdown here…"
      spellcheck="true">
    </textarea>

    <div class="markdown-preview">
      @if (renderedHtml) {
        <div class="markdown-preview-body" [innerHTML]="renderedHtml"></div>
      } @else {
        <p class="markdown-preview-placeholder">Preview will appear here as you type.</p>
      }
    </div>
  </div>
</div>
