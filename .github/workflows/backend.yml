name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    # Windows is a supported platform (ADR-0018); each OS reports on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pom.xml requires Java 25; pinned here so CI never falls back to a runner default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        if: runner.os != 'Windows'
        run: ./mvnw -q test

      # The Windows wrapper, as a Windows developer would run it.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -q test
