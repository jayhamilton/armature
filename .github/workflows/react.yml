name: React host

on:
  push:
    paths:
      - "web/hosts/react/**"
      - "web/packages/core/**"
      - ".github/workflows/react.yml"
  pull_request:
    paths:
      - "web/hosts/react/**"
      - "web/packages/core/**"
      - ".github/workflows/react.yml"

defaults:
  run:
    shell: bash
    working-directory: web/hosts/react

jobs:
  build:
    # Windows is a supported platform (ADR-0018); each OS reports on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            web/packages/core/package-lock.json
            web/hosts/react/package-lock.json

      # The host installs @armature/core as a packed copy of its dist (install-links in .npmrc),
      # so core is built first.
      - name: Build @armature/core
        working-directory: web/packages/core
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # No test suite yet; the build (tsc -b && vite build) is the check.
      - name: Build
        run: npm run build
