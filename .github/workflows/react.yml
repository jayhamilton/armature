name: React host

on:
  push:
    paths:
      - "web/hosts/react/**"
      - ".github/workflows/react.yml"
  pull_request:
    paths:
      - "web/hosts/react/**"
      - ".github/workflows/react.yml"

defaults:
  run:
    working-directory: web/hosts/react

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/hosts/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No test suite yet; the build (tsc -b && vite build) is the check.
      - name: Build
        run: npm run build
