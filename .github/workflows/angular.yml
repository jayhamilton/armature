name: Angular host

on:
  push:
    paths:
      - "web/hosts/angular/**"
      - "web/packages/core/**"
      - ".github/workflows/angular.yml"
  pull_request:
    paths:
      - "web/hosts/angular/**"
      - "web/packages/core/**"
      - ".github/workflows/angular.yml"

defaults:
  run:
    working-directory: web/hosts/angular

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x  # Angular 22 requires Node ^22.22.3, ^24.15.0, or >=26
          cache: npm
          cache-dependency-path: |
            web/packages/core/package-lock.json
            web/hosts/angular/package-lock.json

      # The host installs @armature/core as a packed copy of its dist (install-links in .npmrc),
      # so core is built first.
      - name: Build @armature/core
        working-directory: web/packages/core
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
