name: Angular host

on:
  push:
    paths:
      - "web/hosts/angular/**"
      - ".github/workflows/angular.yml"
  pull_request:
    paths:
      - "web/hosts/angular/**"
      - ".github/workflows/angular.yml"

defaults:
  run:
    working-directory: web/hosts/angular

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/hosts/angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
