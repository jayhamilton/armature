name: Web core

on:
  push:
    paths:
      - "web/packages/core/**"
      - "docs/patterns/**"
      - ".github/workflows/web-core.yml"
  pull_request:
    paths:
      - "web/packages/core/**"
      - "docs/patterns/**"
      - ".github/workflows/web-core.yml"

defaults:
  run:
    shell: bash
    working-directory: web/packages/core

jobs:
  build:
    # Windows is a supported platform (ADR-0018); each OS reports on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/packages/core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Fails when the TypeScript half of docs/patterns/index.md is stale.
      - name: Check pattern catalog
        run: npm run catalog:check
