name: Web conformance

# One Playwright suite run against a host (see web/conformance/README.md).
# React only for now; the Angular host runs the same suite locally
# (decision 4 in SPEC-INC-00d).

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-conformance.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-conformance.yml"

# bash on every OS (Git Bash on Windows), so run blocks are the same everywhere.
defaults:
  run:
    shell: bash

jobs:
  react:
    # Windows is a supported platform (ADR-0018); each OS reports on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            web/packages/core/package-lock.json
            web/hosts/react/package-lock.json
            web/conformance/package-lock.json

      # The host installs @armature/core as a packed copy of its dist (install-links in .npmrc),
      # so core is built first.
      - name: Build @armature/core
        working-directory: web/packages/core
        run: |
          npm ci
          npm run build

      - name: Build the React host
        working-directory: web/hosts/react
        run: |
          npm ci
          npm run build

      - name: Install the conformance suite
        working-directory: web/conformance
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck

      # One step, so the preview server started in the background is still running when the
      # suite starts on every OS.
      - name: Serve the React host and run the suite
        env:
          ARMATURE_HOST_URL: http://localhost:4173
        run: |
          (cd web/hosts/react && npx vite preview --port 4173 --strictPort &)
          started=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then started=true; break; fi
            sleep 2
          done
          if [ "$started" != true ]; then echo "The React host did not start"; exit 1; fi
          cd web/conformance && npm test

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-react-report-${{ matrix.os }}
          path: web/conformance/playwright-report
